paths:
  raw_data: data/raw/churn.csv
  processed_data: data/processed/churn_clean.csv
  model: models/churn_model.joblib
  metrics: models/metrics.json

data:
  n_samples: 5000
  random_state: 42
  target: churn
  test_size: 0.2

features:
  numeric:
    - tenure
    - monthly_charges
    - total_charges
    - num_support_calls
    - senior_citizen
  categorical:
    - contract
    - internet_service
    - payment_method
    - tech_support
    - paperless_billing

model:
  type: random_forest
  params:
    n_estimators: 200
    max_depth: 10
    min_samples_leaf: 5
    class_weight: balanced
    n_jobs: -1
    random_state: 42

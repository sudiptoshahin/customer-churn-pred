services:
  api:
    build: .
    image: churn-api:latest
    container_name: churn-api
    ports:
      - "8000:8000"
    volumes:
      # Persist data + trained model on your machine
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  # One-off retraining job:  docker compose run --rm train
  train:
    build: .
    image: churn-api:latest
    profiles: ["train"]
    entrypoint: ["python", "-m", "src.pipelines.training_pipeline"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
